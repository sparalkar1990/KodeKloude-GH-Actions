name: Artifact Upload/Download
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  upload-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create artifact file
        run: echo "This is an artifact file." > artifact.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: my-artifact
          path: artifact.txt